apiVersion: v1
kind: Pod
metadata:
  name: hello-web-smoke
  namespace: homelab
  labels:
    app.kubernetes.io/name: hello-web-smoke
    app.kubernetes.io/part-of: k3s-app-delivery
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - /bin/sh
        - -c
      args:
        - curl --fail --silent --show-error http://hello-web/
      env:
        - name: HOME
          value: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
